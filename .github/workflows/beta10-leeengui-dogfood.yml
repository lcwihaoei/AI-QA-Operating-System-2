name: Beta10 LeeEngUI Dogfood

on:
  push:
    branches:
      - feature/v0.10.0-beta.10-real-project-hardening
    paths:
      - .github/workflows/beta10-leeengui-dogfood.yml
      - src/agents/**
      - src/visual/**
      - src/routes/**
      - src/cli.ts
      - src/core/**
      - test/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta10-leeengui-dogfood
  cancel-in-progress: true

jobs:
  real-project-dogfood:
    if: github.repository == 'lcwihaoei/AI-QA-Operating-System-2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEEENG_BASELINE_SHA: 62b0f430eaf39d2ad1834ebdab89b6718957b0fc
    steps:
      - name: Checkout Beta.10 candidate
        uses: actions/checkout@v4
        with:
          path: aiqa

      - name: Checkout pinned LeeEngUI real-project baseline
        uses: actions/checkout@v4
        with:
          repository: lcwihaoei/LeeEngUI
          ref: ${{ env.LEEENG_BASELINE_SHA }}
          path: leeeng

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record reproducibility metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dogfood/baseline dogfood/.qa-runs
          {
            echo "AIQA_SHA=$(git -C aiqa rev-parse HEAD)"
            echo "LEEENG_SHA=$(git -C leeeng rev-parse HEAD)"
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            echo "OS=$(uname -a)"
          } | tee dogfood/environment.txt
          test "$(git -C leeeng rev-parse HEAD)" = "$LEEENG_BASELINE_SHA"

      - name: Install Beta.10 from root lockfile
        working-directory: aiqa
        run: npm ci --no-audit --no-fund

      - name: Install LeeEngUI from pinned lockfile
        working-directory: leeeng
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for both projects
        shell: bash
        run: |
          set -euo pipefail
          (cd aiqa && npx playwright install --with-deps chromium)
          (cd leeeng && npx playwright install chromium)

      - name: Capture LeeEngUI pre-existing baseline status
        shell: bash
        run: |
          set +e
          cd leeeng
          npm run verify:strict 2>&1 | tee ../dogfood/baseline/verify-strict.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../dogfood/baseline/verify-strict-exit-code.txt
          echo "LeeEngUI baseline exit code: $code"
          exit 0

      - name: Run Beta.10 against real LeeEngUI
        shell: bash
        run: |
          set -euo pipefail
          cat > dogfood/routes.txt <<'ROUTES'
          /
          /component-test
          /system-status
          /not-found
          /fallback-unknown-route
          ROUTES

          (
            cd leeeng
            npm run dev -- --host 127.0.0.1 > ../dogfood/vite.log 2>&1 &
            echo $! > ../dogfood/vite.pid
          )
          cleanup() {
            if [ -f dogfood/vite.pid ]; then kill "$(cat dogfood/vite.pid)" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

          set +e
          cd aiqa
          npm run qa -- \
            --url http://127.0.0.1:5173 \
            --routes-file "$GITHUB_WORKSPACE/dogfood/routes.txt" \
            --risk-mode safe \
            --api-mode off \
            --device-mode off \
            --visual-viewports desktop,tablet,mobile \
            --record-video \
            --max-actions 300 \
            --max-depth 8 \
            --max-candidates-per-page 30 \
            --no-github-plan \
            --no-ux-intelligence \
            --output "$GITHUB_WORKSPACE/dogfood/.qa-runs" \
            2>&1 | tee "$GITHUB_WORKSPACE/dogfood/qa-output.log"
          qa_code=${PIPESTATUS[0]}
          echo "$qa_code" > "$GITHUB_WORKSPACE/dogfood/qa-exit-code.txt"
          cd "$GITHUB_WORKSPACE"
          set -e
          if [ "$qa_code" -ne 0 ] && [ "$qa_code" -ne 2 ]; then
            echo "AI-QA execution crashed with exit code $qa_code" >&2
            exit "$qa_code"
          fi

      - name: Evaluate LeeEngUI Beta.10 regression contract
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(find dogfood/.qa-runs -type f -name result.json | sort | tail -n 1)"
          test -n "$RESULT"
          RESULT="$RESULT" node <<'NODE'
          const fs = require('fs');
          const path = process.env.RESULT;
          const result = JSON.parse(fs.readFileSync(path, 'utf8'));
          const findings = result.findings || [];
          const text = (f) => `${f.title || ''} ${f.message || ''}`;
          const collapsedSidebar = findings.filter((f) =>
            /(app-tab-content|app-menubar-tabs|side-menubar|Collapsed drawer|appMenubar)/i.test(text(f)) &&
            /(offscreen|unreachable|clipped|overlap|outside viewport)/i.test(text(f))
          );
          const counts = findings.reduce((acc, f) => {
            acc[f.severity] = (acc[f.severity] || 0) + 1;
            return acc;
          }, {});
          const summary = {
            aiqaRunId: result.runId,
            visitedUrls: result.visitedUrls || [],
            actions: result.actions,
            coverage: result.coverage,
            findingCounts: counts,
            totalFindings: findings.length,
            beta9ReferenceFindings: 124,
            collapsedSidebarRegressionFindings: collapsedSidebar.map((f) => ({
              fingerprint: f.fingerprint,
              severity: f.severity,
              title: f.title,
              message: f.message,
              url: f.url,
            })),
          };
          fs.writeFileSync('dogfood/beta10-dogfood-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary, null, 2));
          if (collapsedSidebar.length > 0) {
            console.error(`Beta.10 regression: ${collapsedSidebar.length} collapsed-sidebar visual finding(s) remain.`);
            process.exit(1);
          }
          NODE

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta10-leeengui-dogfood-${{ github.sha }}
          path: dogfood
          if-no-files-found: error
          retention-days: 14
