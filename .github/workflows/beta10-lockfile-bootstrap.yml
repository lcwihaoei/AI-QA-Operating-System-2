name: Beta10 Lockfile Bootstrap

on:
  push:
    branches:
      - feature/v0.10.0-beta.10-real-project-hardening
    paths:
      - .github/workflows/beta10-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  create-lockfile:
    if: github.repository == 'lcwihaoei/AI-QA-Operating-System-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.10.0-beta.10-real-project-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean-clone contract
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.packages?.['']?.version !== p.version) process.exit(1)"

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test -f package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m 'chore(beta.10): add reproducible root lockfile'
          git push origin HEAD:feature/v0.10.0-beta.10-real-project-hardening
